name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug -PENCRYPTION_KEY=\"${{ secrets.ENCRYPTION_KEY }}\" --warning-mode=none

    - name: Generate date-based version
      id: version
      run: |
        # 格式：YYYY.MM.DD.BUILD_NUMBER
        DATE_PART=$(date -u +"%Y.%m.%d")
        echo "VERSION=$DATE_PART.${{ github.run_number }}" >> $GITHUB_ENV
        echo "RELEASE_TITLE=Build $DATE_PART (#${{ github.run_number }})" >> $GITHUB_ENV
        echo "TAG_NAME=v$DATE_PART.${{ github.run_number }}" >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        release_name: ${{ env.RELEASE_TITLE }}
        body: |
          📅 **Build Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          🔢 **Build Number:** #${{ github.run_number }}
          🏷️ **Version:** ${{ env.VERSION }}
          📍 **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          
          ⚡ Automatically built and released by GitHub Actions CI/CD
        files: app/build/outputs/apk/appRelease/debug/app-appRelease-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
